<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guia de Download de fotos</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      color: #333;
    }
    table,
    td,
    tr,
    th {
      border: 1px solid #ddd;
      border-collapse: collapse;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    td {
      padding: 8px;
    }
    th {
      background-color: #f16064;
      color: white;
      padding: 8px;
    }
  </style>
  <body>
    <h1>Relatório de Fotos de Produtos</h1>
    <p>Data: {{reportDate}}</p>
    <table style="width: 100%">
      <tr>
        <th>Foto</th>
        <th>Código do Fabricante</th>
        <th>Nome do Produto</th>
        <th>Código da Cor</th>
        <th>Posição</th>
        <th>Código de barras</th>
      </tr>
      {{#each products}}
      <tr>
        <td>{{#if photo}} {{/if}}</td>
        <td>{{manufacturer_code}}</td>
        <td>{{name}}</td>
        <td>{{color_code}}</td>
        <td>{{position}}</td>
        <td>{{barcode}}</td>
      </tr>
      {{/each}}
    </table>
  </body>
</html>
